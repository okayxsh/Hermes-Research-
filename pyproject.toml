[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-alfworld-rq1"
version = "0.1.0"
description = "Reproducible agent-environment experiment foundation"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
alfworld = ["alfworld==0.4.2"]

[project.scripts]
rq1 = "rq1.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
